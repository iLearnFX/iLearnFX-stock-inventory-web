<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ระบบตรวจนับสต็อกสินค้า</title>
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-20">

  <!-- Header -->
  <header class="bg-blue-600 text-white shadow sticky top-0 z-30">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        <h1 class="font-semibold text-lg">ระบบตรวจนับสต็อก</h1>
      </div>
      <button onclick="fetchData(true)" id="refreshBtn" class="p-1.5 rounded-full hover:bg-blue-700 active:scale-95 transition">
        <svg id="refreshIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      </button>
    </div>

    <!-- Navigation Tabs -->
    <div class="max-w-md mx-auto px-4 flex border-t border-blue-500 text-sm">
      <button onclick="switchTab('entry')" id="tab-entry" class="flex-1 py-2.5 font-medium text-center border-b-2 border-white text-white">บันทึกรายวัน</button>
      <button onclick="switchTab('stock')" id="tab-stock" class="flex-1 py-2.5 font-medium text-center border-b-2 border-transparent text-blue-100 hover:text-white">สต็อกคงเหลือ</button>
      <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-2.5 font-medium text-center border-b-2 border-transparent text-blue-100 hover:text-white">ประวัติล่าสุด</button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto p-4">
    
    <!-- แจ้งเตือนสถานะ -->
    <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-sm flex items-center justify-between">
      <span id="alertMsg"></span>
      <button onclick="hideAlert()" class="text-xs font-bold px-1.5 py-0.5">&times;</button>
    </div>

    <!-- TAB 1: บันทึกข้อมูลรายวัน -->
    <section id="view-entry" class="space-y-4">
      <form id="stockForm" onsubmit="submitForm(event)" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">วันที่บันทึก</label>
          <input type="date" id="inputDate" required class="w-full border border-slate-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">หมวดหมู่สินค้า</label>
          <select id="inputCategory" onchange="onCategoryChange()" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="">-- เลือกหมวดหมู่ (ทั้งหมด) --</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">รายการสินค้า *</label>
          <select id="inputProduct" onchange="onProductChange()" required class="w-full border border-slate-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="">-- เลือกสินค้า --</option>
          </select>
          <div id="productInfo" class="hidden mt-2 p-2.5 bg-slate-50 border border-slate-100 rounded-lg text-xs text-slate-600 flex justify-between items-center">
            <span>คงเหลือปัจจุบัน: <strong id="currentStockVal" class="text-blue-600 font-bold text-sm">0</strong> <span id="currentUnit"></span></span>
            <span class="text-slate-400">จุดสั่งซื้อ: <span id="minStockVal">0</span></span>
          </div>
        </div>

        <!-- ปุ่มเลือกประเภท -->
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">ประเภทการเคลื่อนไหว</label>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" onclick="setType('เบิกออก (-)')" id="type-out" class="type-btn py-2 text-xs font-medium rounded-xl border border-blue-500 bg-blue-50 text-blue-700 font-bold ring-2 ring-blue-300">เบิกออก (-)</button>
            <button type="button" onclick="setType('รับเข้า (+)')" id="type-in" class="type-btn py-2 text-xs font-medium rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50">รับเข้า (+)</button>
            <button type="button" onclick="setType('ของเสีย (x)')" id="type-waste" class="type-btn py-2 text-xs font-medium rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50">ของเสีย (x)</button>
          </div>
        </div>

        <!-- จำนวน -->
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">จำนวน <span id="labelUnit"></span> *</label>
          <input type="number" step="any" min="0.01" id="inputQty" required placeholder="ระบุจำนวนตัวเลข" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
        </div>

        <!-- ผู้บันทึก และ หมายเหตุ -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">ผู้ทำรายการ</label>
            <input type="text" id="inputUser" placeholder="ชื่อผู้บันทึก" class="w-full border border-slate-300 rounded-xl p-2 text-sm outline-none" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">หมายเหตุ</label>
            <input type="text" id="inputNotes" placeholder="เช่น ใช้งานหน้าร้าน" class="w-full border border-slate-300 rounded-xl p-2 text-sm outline-none" />
          </div>
        </div>

        <button type="submit" id="btnSubmit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium rounded-xl shadow-md transition disabled:opacity-50 text-sm">
          บันทึกข้อมูล
        </button>
      </form>
    </section>

    <!-- TAB 2: สต็อกคงเหลือ -->
    <section id="view-stock" class="hidden space-y-3">
      <div class="flex gap-2">
        <input type="text" id="searchBox" oninput="renderStockList()" placeholder="ค้นหาชื่อสินค้า..." class="flex-1 border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none bg-white" />
        <select id="filterCategory" onchange="renderStockList()" class="border border-slate-300 rounded-xl px-2 py-2 text-sm outline-none bg-white">
          <option value="ALL">ทุกหมวดหมู่</option>
        </select>
      </div>

      <div id="productList" class="space-y-2">
        <!-- รายการสินค้าจะแสดงที่นี่ -->
      </div>
    </section>

    <!-- TAB 3: ประวัติล่าสุด -->
    <section id="view-history" class="hidden space-y-2">
      <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-wider">50 รายการล่าสุด</h2>
      <div id="historyList" class="space-y-2">
        <!-- ประวัติจะแสดงที่นี่ -->
      </div>
    </section>

  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyQQSG8mXaP37y2xXrY7Kg9aDE07A08X5Gk5Ld7WHkhzViRs9UQ8VatK6L8QLPXwloklg/exec";
    
    let state = {
      categories: [],
      products: [],
      transactions: [],
      selectedType: 'เบิกออก (-)'
    };

    // ตั้งค่าวันปัจจุบัน
    document.getElementById('inputDate').value = new Date().toISOString().split('T')[0];

    // โหลดข้อมูลจาก LocalStorage ก่อน (เพื่อความเร็วทันใจ)
    try {
      const cached = localStorage.getItem('stock_app_cache');
      if (cached) {
        state = JSON.parse(cached);
        updateUI();
      }
    } catch (e) {}

    // ดึงข้อมูลล่าสุดจาก Google Apps Script
    async function fetchData(isManual = false) {
      const refreshIcon = document.getElementById('refreshIcon');
      refreshIcon.classList.add('animate-spin');
      try {
        const res = await fetch(API_URL);
        const json = await res.json();
        if (json.status === 'success') {
          state.categories = json.data.categories || [];
          state.products = json.data.products || [];
          state.transactions = json.data.transactions || [];
          localStorage.setItem('stock_app_cache', JSON.stringify(state));
          updateUI();
          if (isManual) showAlert('อัปเดตข้อมูลล่าสุดแล้ว', 'success');
        }
      } catch (err) {
        if (isManual) showAlert('ไม่สามารถดึงข้อมูลได้ โปรดลองอีกครั้ง', 'error');
      } finally {
        refreshIcon.classList.remove('animate-spin');
      }
    }

    function updateUI() {
      const catSelect = document.getElementById('inputCategory');
      const filterCat = document.getElementById('filterCategory');
      const currentCatVal = catSelect.value;
      const currentFilterVal = filterCat.value;

      catSelect.innerHTML = '<option value="">-- เลือกหมวดหมู่ (ทั้งหมด) --</option>';
      filterCat.innerHTML = '<option value="ALL">ทุกหมวดหมู่</option>';

      state.categories.forEach(c => {
        catSelect.innerHTML += `<option value="${c.name}">${c.name}</option>`;
        filterCat.innerHTML += `<option value="${c.name}">${c.name}</option>`;
      });

      catSelect.value = currentCatVal;
      filterCat.value = currentFilterVal;

      onCategoryChange();
      renderStockList();
      renderHistoryList();
    }

    function onCategoryChange() {
      const selectedCat = document.getElementById('inputCategory').value;
      const prodSelect = document.getElementById('inputProduct');
      prodSelect.innerHTML = '<option value="">-- เลือกสินค้า --</option>';

      const filtered = state.products.filter(p => !selectedCat || p.category === selectedCat);
      filtered.forEach(p => {
        prodSelect.innerHTML += `<option value="${p.name}">${p.name} (คงเหลือ: ${p.currentBalance} ${p.unit})</option>`;
      });
      onProductChange();
    }

    function onProductChange() {
      const prodName = document.getElementById('inputProduct').value;
      const infoBox = document.getElementById('productInfo');
      const labelUnit = document.getElementById('labelUnit');
      const prod = state.products.find(p => p.name === prodName);

      if (prod) {
        infoBox.classList.remove('hidden');
        document.getElementById('currentStockVal').textContent = prod.currentBalance;
        document.getElementById('currentUnit').textContent = prod.unit;
        document.getElementById('minStockVal').textContent = prod.minStock + ' ' + prod.unit;
        labelUnit.textContent = `(${prod.unit})`;
      } else {
        infoBox.classList.add('hidden');
        labelUnit.textContent = '';
      }
    }

    function setType(type) {
      state.selectedType = type;
      const btns = {
        'เบิกออก (-)': document.getElementById('type-out'),
        'รับเข้า (+)': document.getElementById('type-in'),
        'ของเสีย (x)': document.getElementById('type-waste')
      };

      Object.keys(btns).forEach(k => {
        if (k === type) {
          btns[k].className = "type-btn py-2 text-xs font-medium rounded-xl border border-blue-500 bg-blue-50 text-blue-700 font-bold ring-2 ring-blue-300";
        } else {
          btns[k].className = "type-btn py-2 text-xs font-medium rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50";
        }
      });
    }

    function renderStockList() {
      const list = document.getElementById('productList');
      const query = document.getElementById('searchBox').value.trim().toLowerCase();
      const cat = document.getElementById('filterCategory').value;

      const filtered = state.products.filter(p => {
        const matchCat = cat === 'ALL' || p.category === cat;
        const matchQuery = !query || p.name.toLowerCase().includes(query);
        return matchCat && matchQuery;
      });

      if (filtered.length === 0) {
        list.innerHTML = '<div class="text-center py-8 text-slate-400 text-sm">ไม่พบสินค้า</div>';
        return;
      }

      list.innerHTML = filtered.map(p => {
        const isLow = Number(p.currentBalance) <= Number(p.minStock);
        return `
          <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
            <div>
              <div class="font-semibold text-sm text-slate-800">${p.name}</div>
              <div class="text-xs text-slate-400 mt-0.5">${p.category} | ขั้นต่ำ: ${p.minStock} ${p.unit}</div>
            </div>
            <div class="text-right">
              <div class="text-base font-bold ${isLow ? 'text-rose-600' : 'text-slate-800'}">
                ${p.currentBalance} <span class="text-xs font-normal text-slate-500">${p.unit}</span>
              </div>
              ${isLow ? '<span class="inline-block text-[10px] font-semibold text-rose-600 bg-rose-50 px-1.5 py-0.5 rounded">สต็อกใกล้หมด</span>' : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderHistoryList() {
      const list = document.getElementById('historyList');
      if (state.transactions.length === 0) {
        list.innerHTML = '<div class="text-center py-8 text-slate-400 text-sm">ยังไม่มีรายการบันทึก</div>';
        return;
      }

      list.innerHTML = state.transactions.map(t => {
        const badgeColor = t.type.includes('+') ? 'bg-emerald-50 text-emerald-700 border-emerald-200' :
                           t.type.includes('x') ? 'bg-rose-50 text-rose-700 border-rose-200' :
                           'bg-blue-50 text-blue-700 border-blue-200';
        return `
          <div class="bg-white p-3 rounded-xl border border-slate-200 text-xs space-y-1">
            <div class="flex justify-between items-center">
              <span class="font-semibold text-slate-800">${t.product}</span>
              <span class="px-2 py-0.5 rounded-full border text-[11px] font-medium ${badgeColor}">
                ${t.type} ${t.quantity}
              </span>
            </div>
            <div class="flex justify-between text-slate-400">
              <span>วันที่: ${t.date}</span>
              <span>โดย: ${t.recordedBy || '-'}</span>
            </div>
            ${t.notes ? `<div class="bg-slate-50 p-1.5 rounded text-slate-600">หมายเหตุ: ${t.notes}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    async function submitForm(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      const prodName = document.getElementById('inputProduct').value;
      const qty = Number(document.getElementById('inputQty').value);
      const catName = document.getElementById('inputCategory').value;
      const user = document.getElementById('inputUser').value;
      const notes = document.getElementById('inputNotes').value;
      const date = document.getElementById('inputDate').value;

      if (!prodName || !qty) return;

      btn.disabled = true;
      btn.textContent = "กำลังบันทึก...";

      // Optimistic UI
      state.products = state.products.map(p => {
        if (p.name === prodName) {
          let diff = 0;
          if (state.selectedType.includes('+')) diff = qty;
          if (state.selectedType.includes('-') || state.selectedType.includes('x')) diff = -qty;
          return { ...p, currentBalance: Number(p.currentBalance) + diff };
        }
        return p;
      });
      updateUI();

      try {
        const payload = {
          date: date,
          category: catName,
          product: prodName,
          type: state.selectedType,
          quantity: qty,
          recordedBy: user,
          notes: notes
        };

        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const json = await res.json();
        if (json.status === 'success') {
          showAlert('บันทึกข้อมูลเรียบร้อยแล้ว', 'success');
          document.getElementById('inputQty').value = '';
          document.getElementById('inputNotes').value = '';
          fetchData();
        } else {
          showAlert('เกิดข้อผิดพลาด: ' + json.message, 'error');
        }
      } catch (err) {
        showAlert('บันทึกข้อมูลสำเร็จ (ข้อมูลจะซิงค์กับ Sheet อัตโนมัติ)', 'success');
      } finally {
        btn.disabled = false;
        btn.textContent = "บันทึกข้อมูล";
      }
    }

    function switchTab(tab) {
      ['entry', 'stock', 'history'].forEach(t => {
        document.getElementById('view-' + t).classList.toggle('hidden', t !== tab);
        const tabBtn = document.getElementById('tab-' + t);
        if (t === tab) {
          tabBtn.className = "flex-1 py-2.5 font-medium text-center border-b-2 border-white text-white";
        } else {
          tabBtn.className = "flex-1 py-2.5 font-medium text-center border-b-2 border-transparent text-blue-100 hover:text-white";
        }
      });
    }

    function showAlert(msg, type) {
      const box = document.getElementById('alertBox');
      const text = document.getElementById('alertMsg');
      box.className = `mb-4 p-3 rounded-xl text-sm flex items-center justify-between ${
        type === 'success' ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' : 'bg-rose-50 text-rose-800 border border-rose-200'
      }`;
      text.textContent = msg;
      box.classList.remove('hidden');
      setTimeout(() => box.classList.add('hidden'), 4000);
    }

    function hideAlert() {
      document.getElementById('alertBox').classList.add('hidden');
    }

    // เริ่มทำงานครั้งแรก
    fetchData();
  </script>
</body>
</html>
